<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ズームしないようにする指定 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>あじゅ危機一髪</title>
<style>
  :root {
    --bg: #fdf6ec;
    --ink: #4a3b2f;
    --barrel: #b9773f;
    --barrel-dark: #8a5424;
    --band: #6b6b6b;
    --hole: #3a2412;
    --accent: #e0655a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    touch-action: manipulation;          /* ダブルタップのズームを止める */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 16px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  #msg { min-height: 1.6em; font-size: 16px; margin: 4px 0 8px; }
  #count { font-size: 14px; opacity: .75; }
  svg { width: 100%; height: auto; overflow: visible; }
  .hole { cursor: pointer; }
  .hole .dot { fill: var(--hole); }
  .hole .pad { fill: transparent; }
  .hole.used { cursor: default; }
  button {
    font: inherit;
    font-size: 16px;
    padding: 10px 28px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    margin-top: 8px;
    visibility: hidden;
  }
  button.show { visibility: visible; }

  /* あじゅが飛び出すアニメーション */
  #ajyu { transform-box: fill-box; transform-origin: center; }
  #ajyu.pop { animation: pop 1.1s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes pop {
    0%   { transform: translateY(0) rotate(0deg); }
    60%  { transform: translateY(-150px) rotate(340deg); }
    100% { transform: translateY(-120px) rotate(360deg); }
  }
  /* 樽がぶるっと揺れる */
  #barrel.shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
</style>
</head>
<body>

    <!-- 樽 -->
    <g id="barrel">
      <path d="M62 140 Q50 230 62 318 L238 318 Q250 230 238 140 Z" fill="var(--barrel)"/>
      <path d="M62 140 Q50 230 62 318 L84 318 Q74 230 84 140 Z" fill="var(--barrel-dark)" opacity=".45"/>
      <path d="M238 140 Q250 230 238 318 L216 318 Q226 230 216 140 Z" fill="var(--barrel-dark)" opacity=".45"/>
      <rect x="55" y="160" width="190" height="9" rx="3" fill="var(--band)"/>
      <rect x="53" y="290" width="194" height="9" rx="3" fill="var(--band)"/>
      <!-- 樽のふち（あじゅの前に来る） -->
      <ellipse cx="150" cy="140" rx="88" ry="16" fill="var(--barrel-dark)"/>
      <ellipse cx="150" cy="140" rx="78" ry="11" fill="#5a3515"/>
      <g id="holes"></g>
      <g id="swords"></g>
    </g>
  </svg>

  <button id="again">もう一回</button>
</main>

<script>
  const holesG  = document.getElementById("holes");
  const swordsG = document.getElementById("swords");
  const ajyu    = document.getElementById("ajyu");
  const barrel  = document.getElementById("barrel");
  const msg     = document.getElementById("msg");
  const countEl = document.getElementById("count");
  const again   = document.getElementById("again");
  const NS = "http://www.w3.org/2000/svg";


  // 剣の持ち手の色（順番に使う）
  const colors = ["#e0655a", "#4a8fd8", "#f2c14e", "#5bb56b", "#a56cc1"];

  // 穴の位置（3段 × 5列）
  const holes = [];
  [195, 235, 272].forEach(y => {
    for (let i = 0; i < 5; i++) holes.push({ x: 86 + i * 32, y });
  });

  let hit, count, over;

  function start() {
    holesG.innerHTML = "";
    swordsG.innerHTML = "";
    ajyu.classList.remove("pop");
    again.classList.remove("show");
    count = 0;
    over = false;
    hit = Math.floor(Math.random() * holes.length); // 当たりの穴
    msg.textContent = "穴をタップして剣をさしてね";
    countEl.textContent = "さした本数：0";

    holes.forEach((h, i) => {
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "hole");
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", h.x);
      c.setAttribute("cy", h.y);
      c.setAttribute("r", 9);
      c.setAttribute("class", "dot");
      // タップしやすいように透明な大きめの当たり判定
      const pad = document.createElementNS(NS, "circle");
      pad.setAttribute("cx", h.x);
      pad.setAttribute("cy", h.y);
      pad.setAttribute("r", 16);
      pad.setAttribute("class", "pad");
      g.append(c, pad);
      g.addEventListener("click", () => stab(i, g));
      holesG.appendChild(g);
    });
  }

  function stab(i, g) {
    if (over || g.classList.contains("used")) return;
    g.classList.add("used");
    count++;
    countEl.textContent = "さした本数：" + count;

    // 剣の持ち手を穴からななめに出す
    const h = holes[i];
    const color = colors[(count - 1) % colors.length];
    const s = document.createElementNS(NS, "g");
    s.setAttribute("transform", `translate(${h.x} ${h.y}) rotate(-25)`);
    s.innerHTML = `
      <rect x="-3" y="-30" width="6" height="30" rx="2" fill="${color}"/>
      <rect x="-9" y="-4" width="18" height="5" rx="2" fill="#555"/>
      <circle cx="0" cy="-32" r="4" fill="${color}"/>`;
    swordsG.appendChild(s);

    barrel.classList.remove("shake");
    void barrel.getBBox();
    barrel.classList.add("shake");

    if (i === hit) {
      over = true;
      ajyu.classList.add("pop");
      msg.textContent = "あじゅが飛び出した！";
      setTimeout(() => again.classList.add("show"), 900);
    } else if (count === holes.length - 1) {
      msg.textContent = "残りはひとつ…";
    } else {
      msg.textContent = "セーフ！";
    }
  }

  again.addEventListener("click", start);
  start();
</script>
