<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あじゅの障害物競走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
[hidden]{display:none!important}
/* layout: one play field — title strip, progress track to the goal flag, canvas course, jump button */
:root{
  --bg:#f3f0e6;
  --ink:#4a3b2c;
  --muted:#857462;
  --accent:#e2837a;
  --face:#fffdf7;
  --line:#c9a77c;
  --shadow:0 2px 0 rgba(74,59,44,.18);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#23201b;--ink:#f1e8d8;--muted:#b9aa95;--accent:#ee9a90;--face:#fbf6ea;--line:#8c6c49;--shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#23201b;--ink:#f1e8d8;--muted:#b9aa95;--accent:#ee9a90;--face:#fbf6ea;--line:#8c6c49;--shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);padding-inline:16px;padding-block:16px 28px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px}
header img{width:58px;height:58px;flex:none}
h1{font-size:1.5rem;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.stats{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:1.1rem}
.field{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:auto;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;background:rgba(255,253,247,.78);color:#4a3b2c}
.overlay img{width:min(26%,130px);height:auto}
.overlay p{margin:0}
.big{font-size:clamp(1.1rem,4.5vw,1.5rem);font-weight:900}
.btn{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 24px;cursor:pointer;margin-top:4px}
.btn:focus-visible,.jump:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.yay{position:absolute;left:50%;top:50%;width:min(34%,190px);transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.yay img{width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(74,59,44,.25))}
.yay.small{left:auto;right:3%;top:16%;width:min(15%,84px);transform:scale(.6);transform-origin:top right}
.yay.small.show{animation:yaysm 1.3s ease forwards}
.yay.small .bubble{font-size:clamp(.7rem,2.6vw,1rem);padding:1px 10px;border-width:2px}
@keyframes yaysm{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.bubble{position:relative;background:#fffdf7;color:#e2837a;border:3px solid #e2837a;font-weight:900;font-size:clamp(1rem,4.5vw,1.6rem);padding:3px 16px;border-radius:999px;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#e2837a}
.yay.show{animation:yay 1.3s ease forwards}
@keyframes yay{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}18%{opacity:1;transform:translate(-50%,-52%) scale(1.06)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.jump{font:inherit;font-weight:900;font-size:1.2rem;background:var(--line);color:var(--face);border:0;border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--shadow)}
.jump:active{transform:translateY(2px)}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
footer{color:var(--muted);font-size:.78rem;text-align:center}
@media (prefers-reduced-motion:reduce){.yay.show{animation:none;opacity:1;transform:translate(-50%,-50%)}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <img id="logo" alt="">
    <div>
      <h1>あじゅの障害物競走</h1>
      <p class="sub">ジャンプでよけて、ゴールまで走ろう</p>
    </div>
  </header>
  <div class="stats">
    <span>ぶつかった <b id="hits">0</b> 回</span>
    <span>じかん <b id="time">0.0</b> 秒</span>
  </div>
  <div class="field" id="field">
    <canvas id="cv" width="800" height="320" aria-label="あじゅが走るコース"></canvas>
    <div class="yay" id="yay"><div class="bubble" id="yaytext" aria-live="polite"></div><img id="yayimg" alt=""></div>
    <div class="overlay" id="startScreen">
      <img id="startimg" alt="走るあじゅ">
      <p class="big">よーい、どん！</p>
      <p>タップ・クリック・スペースキーでジャンプ</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>
    <div class="overlay" id="goalScreen" hidden>
      <img id="goalimg" alt="よろこぶあじゅ">
      <p class="big">ゴール！</p>
      <p id="goalmsg"></p>
      <button class="btn" id="againBtn">もういちど</button>
    </div>
  </div>
  <button class="jump" id="jumpBtn">ジャンプ</button>
  <p class="hint">ぶつかってもだいじょうぶ。ちょっとよろけるだけだよ</p>
  <footer>桜 歩美のあじゅゲームセンター</footer>
</div>

const $ = id => document.getElementById(id);
$("logo").src = IMG.run; $("startimg").src = IMG.run; $("goalimg").src = IMG.win; $("yayimg").src = IMG.yay;
const run = new Image(); run.src = IMG.run;

const cv = $("cv"), ctx = cv.getContext("2d");
const W = 800, H = 320, GROUND = 262;
const COURSE = 9000;           // ゴールまでの距離
const AJU = 86;                // あじゅの描画サイズ
const AX = 110;                // あじゅの横位置

let state = "ready", dist = 0, speed = 0, vy = 0, y = 0, onGround = true;
let obstacles = [], clouds = [], flowers = [], hits = 0, stumble = 0, t0 = 0, elapsed = 0, last = 0, passed = 0;

function rnd(a,b){return a + Math.random()*(b-a)}
function buildCourse(){
  obstacles = [];
  let x = 900;
  const kinds = ["hurdle","rock","stump","hurdle","puddle"];
  while (x < COURSE - 500){
    const k = kinds[Math.floor(Math.random()*kinds.length)];
    const w = k==="hurdle"?34:k==="rock"?46:k==="stump"?40:70;
    const h = k==="hurdle"?52:k==="rock"?32:k==="stump"?44:8;
    obstacles.push({x, k, w, h, hit:false, cleared:false});
    x += rnd(420, 700);
  }
  clouds = Array.from({length:6},()=>({x:rnd(0,W*2),y:rnd(24,110),s:rnd(.7,1.3)}));
  flowers = Array.from({length:14},()=>({x:rnd(0,W*1.5),c:Math.random()<.5?"#f2a7b6":"#f6d36b"}));
}

function reset(){
  dist=0; speed=5; vy=0; y=0; onGround=true; hits=0; stumble=0; elapsed=0; passed=0;
  $("hits").textContent=0; $("time").textContent="0.0";
  buildCourse();
}

function jump(){
  if (state==="ready"){ startGame(); return; }
  if (state!=="run" || !onGround) return;
  vy = -13.2; onGround=false;
}

function startGame(){
  reset(); state="run"; $("startScreen").hidden=true; $("goalScreen").hidden=true;
  t0=performance.now(); last=t0; requestAnimationFrame(loop);
}

const CHEERS=["やったね！","いいね！","じょうず！","そのちょうし！"];
let yayT=null;
function cheer(text, small){
  const el=$("yay"); $("yaytext").textContent=text; el.classList.toggle("small", !!small);
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  clearTimeout(yayT); yayT=setTimeout(()=>el.classList.remove("show"),1400);
}

function loop(now){
  if (state!=="run") return;
  const dt = Math.min(2.5, (now-last)/16.667); last=now;
  elapsed = (now-t0)/1000;
  // スピード：だんだん少し速く。よろけ中はゆっくり
  const base = 5 + Math.min(1.5, dist/COURSE*1.5);
  speed = stumble>0 ? base*0.45 : base;
  if (stumble>0) stumble -= dt;
  dist += speed*dt;
  // ジャンプ
  vy += 0.62*dt; y += vy*dt;
  if (y>=0){ y=0; vy=0; onGround=true; }
  // 当たり判定
  const ax1 = AX+22, ax2 = AX+AJU-22, ay = GROUND + y; // あじゅの足元
  for (const o of obstacles){
    const sx = o.x - dist + AX;
    if (!o.hit && !o.cleared && sx < ax2 && sx+o.w > ax1){
      const top = GROUND - o.h;
      if (ay > top + 4){ o.hit=true; hits++; stumble=48; $("hits").textContent=hits; }
    }
    if (!o.hit && !o.cleared && sx + o.w < ax1){
      o.cleared=true; passed++;
      if (passed % 3 === 0) cheer(CHEERS[Math.floor(Math.random()*CHEERS.length)], true);
    }
  }
  $("time").textContent = elapsed.toFixed(1);
  draw();
  if (dist >= COURSE){ finish(); return; }
  requestAnimationFrame(loop);
}

function finish(){
  state="goal";
  const msg = hits===0 ? "いちどもぶつからなかったよ。すごい！" : hits<=3 ? "ほとんどよけられたね" : "最後まで走りきったね";
  $("goalmsg").textContent = elapsed.toFixed(1)+"秒でゴール。ぶつかったのは"+hits+"回。"+msg;
  cheer("やったね！");
  setTimeout(()=>{ $("goalScreen").hidden=false; $("againBtn").focus(); }, 900);
}

function drawObstacle(o, sx){
  const g = GROUND;
  if (o.k==="hurdle"){
    ctx.fillStyle="#8a6a4a"; ctx.fillRect(sx+2,g-o.h,5,o.h); ctx.fillRect(sx+o.w-7,g-o.h,5,o.h);
    for (let i=0;i<4;i++){ ctx.fillStyle = i%2? "#ffffff":"#e2837a"; ctx.fillRect(sx+i*(o.w/4), g-o.h, o.w/4+0.5, 10); }
    ctx.strokeStyle="#8a6a4a"; ctx.lineWidth=2; ctx.strokeRect(sx, g-o.h, o.w, 10);
  } else if (o.k==="rock"){
    ctx.fillStyle="#a39d93"; ctx.beginPath(); ctx.ellipse(sx+o.w/2, g-o.h/2+2, o.w/2, o.h/2+2, 0, Math.PI, 0); ctx.lineTo(sx+o.w, g); ctx.lineTo(sx, g); ctx.fill();
    ctx.fillStyle="#c4beb4"; ctx.beginPath(); ctx.ellipse(sx+o.w*0.38, g-o.h*0.62, o.w*0.16, o.h*0.14, -0.4, 0, Math.PI*2); ctx.fill();
  } else if (o.k==="stump"){
    ctx.fillStyle="#9b7148"; ctx.fillRect(sx, g-o.h+6, o.w, o.h-6);
    ctx.fillStyle="#d9b98c"; ctx.beginPath(); ctx.ellipse(sx+o.w/2, g-o.h+6, o.w/2, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle="#9b7148"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(sx+o.w/2, g-o.h+6, o.w/4, 3.5, 0, 0, Math.PI*2); ctx.stroke();
  } else {
    ctx.fillStyle="#8fc3dd"; ctx.beginPath(); ctx.ellipse(sx+o.w/2, g+2, o.w/2, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#c6e3f0"; ctx.beginPath(); ctx.ellipse(sx+o.w*0.35, g, o.w*0.14, 2.5, 0, 0, Math.PI*2); ctx.fill();
  }
}

function draw(){
  // 空
  const sky = ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,"#bfe2f2"); sky.addColorStop(1,"#eef7f0");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // 雲
  ctx.fillStyle="#ffffff";
  for (const c of clouds){
    const cx = ((c.x - dist*0.15) % (W*2) + W*2) % (W*2) - 100;
    ctx.beginPath(); ctx.arc(cx, c.y, 18*c.s, 0, Math.PI*2); ctx.arc(cx+22*c.s, c.y-8*c.s, 22*c.s, 0, Math.PI*2); ctx.arc(cx+46*c.s, c.y, 16*c.s, 0, Math.PI*2); ctx.fill();
  }
  // 遠くの丘
  ctx.fillStyle="#cfe3b4";
  for (let i=-1;i<5;i++){ const hx = i*260 - (dist*0.35)%260; ctx.beginPath(); ctx.ellipse(hx+130, GROUND+10, 170, 70, 0, Math.PI, 0); ctx.fill(); }
  // 地面
  ctx.fillStyle="#a8cf86"; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#d8bf93"; ctx.fillRect(0,GROUND+14,W,26);
  ctx.fillStyle="#ffffff";
  for (let i=0;i<12;i++){ const lx = i*90 - dist%90; ctx.fillRect(lx, GROUND+25, 40, 3); }
  // 花
  for (const f of flowers){
    const fx = ((f.x - dist) % (W*1.5) + W*1.5) % (W*1.5) - 30;
    ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(fx, GROUND+52, 4, 0, Math.PI*2); ctx.fill();
  }
  // ゴールの旗
  const gx = COURSE - dist + AX + AJU;
  if (gx < W+40){
    ctx.fillStyle="#8a6a4a"; ctx.fillRect(gx, GROUND-120, 6, 120);
    ctx.fillStyle="#e2837a"; ctx.beginPath(); ctx.moveTo(gx+6,GROUND-120); ctx.lineTo(gx+60,GROUND-104); ctx.lineTo(gx+6,GROUND-88); ctx.fill();
    ctx.fillStyle="#ffffff"; ctx.font="bold 14px 'Zen Maru Gothic',sans-serif"; ctx.fillText("ゴール", gx+10, GROUND-99);
  }
  // 障害物
  for (const o of obstacles){
    const sx = o.x - dist + AX;
    if (sx > -100 && sx < W+100) drawObstacle(o, sx);
  }
  // あじゅ
  const bob = onGround && state==="run" ? Math.abs(Math.sin(dist/14))*-4 : 0;
  ctx.save();
  if (stumble>0 && Math.floor(stumble/4)%2===0) ctx.globalAlpha=0.45;
  const ytop = GROUND + y + bob - AJU*0.84;
  if (stumble>0){ ctx.translate(AX+AJU/2, ytop+AJU/2); ctx.rotate(-0.25); ctx.drawImage(run, -AJU/2, -AJU/2, AJU, AJU); }
  else ctx.drawImage(run, AX, ytop, AJU, AJU);
  ctx.restore();
  // 進みぐあい
  const pw = W-120, px = 60, py = 18, p = Math.min(1, dist/COURSE);
  ctx.fillStyle="rgba(255,255,255,.75)"; ctx.beginPath(); ctx.roundRect(px-8, py-8, pw+16, 16, 8); ctx.fill();
  ctx.fillStyle="#e2837a"; ctx.beginPath(); ctx.roundRect(px-4, py-4, Math.max(8,pw*p+8), 8, 4); ctx.fill();
  ctx.drawImage(run, px + pw*p - 14, py-17, 28, 28);
  ctx.fillStyle="#8a6a4a"; ctx.fillRect(px+pw+6, py-12, 3, 20);
  ctx.fillStyle="#e2837a"; ctx.beginPath(); ctx.moveTo(px+pw+9,py-12); ctx.lineTo(px+pw+22,py-7); ctx.lineTo(px+pw+9,py-2); ctx.fill();
}

$("startBtn").addEventListener("click", e=>{ e.stopPropagation(); startGame(); });
$("againBtn").addEventListener("click", e=>{ e.stopPropagation(); startGame(); });
$("jumpBtn").addEventListener("click", jump);
cv.addEventListener("pointerdown", e=>{ e.preventDefault(); jump(); });
window.addEventListener("keydown", e=>{
  if (e.code==="Space" || e.code==="ArrowUp"){
    if (document.activeElement && document.activeElement.tagName==="BUTTON" && document.activeElement!==$("jumpBtn") && state!=="run") return;
    e.preventDefault(); jump();
  }
});
reset();
run.onload = draw;
if (run.complete) draw();
</script>
