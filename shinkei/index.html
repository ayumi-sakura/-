<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あじゅの神経衰弱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
[hidden]{display:none!important}
/* layout: one centered play table — title strip, level chips, score line, card grid */
:root{
  --bg:#f3f0e6;        /* 芝生まじりの紙 */
  --table:#e3ead3;     /* 庭のテーブル */
  --card-back:#c9a77c; /* どんぐり色 */
  --card-back-2:#b48f62;
  --face:#fffdf7;
  --ink:#4a3b2c;
  --muted:#857462;
  --accent:#e2837a;    /* ほっぺの色 */
  --ok:#7fa865;
  --shadow:0 2px 0 rgba(74,59,44,.18);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#23201b;--table:#2f3527;--card-back:#8c6c49;--card-back-2:#76593a;--face:#fbf6ea;
  --ink:#f1e8d8;--muted:#b9aa95;--accent:#ee9a90;--ok:#9cc382;--shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#23201b;--table:#2f3527;--card-back:#8c6c49;--card-back-2:#76593a;--face:#fbf6ea;
  --ink:#f1e8d8;--muted:#b9aa95;--accent:#ee9a90;--ok:#9cc382;--shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);padding-inline:16px;padding-block:16px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px}
header img{width:58px;height:58px;flex:none}
h1{font-size:1.5rem;font-weight:900;margin:0;text-wrap:balance;letter-spacing:.02em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.levels button{font:inherit;font-weight:700;font-size:.9rem;border:2px solid var(--card-back);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--card-back);color:var(--face)}
.levels button:focus-visible,.card:focus-visible,.again:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:1.1rem}
.table{background:var(--table);border-radius:18px;padding:12px;position:relative}
.grid{display:grid;gap:8px;grid-template-columns:repeat(var(--cols),1fr)}
.card{appearance:none;border:0;padding:0;background:none;aspect-ratio:1;perspective:600px;cursor:pointer;max-width:100%}
.inner{position:relative;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,var(--card-back) 0 8px,var(--card-back-2) 8px 16px)}
.back span{width:42%;aspect-ratio:1;border-radius:50%;background:var(--face);display:grid;place-items:center;font-weight:900;color:var(--card-back-2);font-size:clamp(.9rem,4vw,1.4rem)}
.front{background:var(--face);transform:rotateY(180deg)}
.front img{width:88%;height:88%;object-fit:contain}
.card.done .front{box-shadow:0 0 0 3px var(--ok)}
.card.done .inner{animation:pop .4s ease .35s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.08)}}
.win{position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--table) 92%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.win img{width:120px;height:120px}
.win p{margin:0}
.win .big{font-size:1.3rem;font-weight:900}
.again{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer;margin-top:6px}
.yay{position:absolute;left:50%;top:50%;width:min(62%,230px);transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
.yay img{width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(74,59,44,.25))}
.yay .bubble{position:relative;background:var(--face);color:var(--accent);border:3px solid var(--accent);font-weight:900;font-size:clamp(1.2rem,6vw,1.8rem);padding:4px 18px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}
.yay .bubble::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--accent)}
.yay.show{animation:yay 1.3s ease forwards}
@keyframes yay{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}18%{opacity:1;transform:translate(-50%,-52%) scale(1.06)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.yay.show{animation:none;opacity:1;transform:translate(-50%,-50%)}}
footer{color:var(--muted);font-size:.78rem;text-align:center}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.card.done .inner{animation:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <img id="logo" alt="">
    <div>
      <h1>あじゅの神経衰弱</h1>
      <p class="sub">同じあじゅを2枚そろえてね</p>
    </div>
  </header>
  <div class="levels" role="group" aria-label="むずかしさ">
    <button id="lv6" data-pairs="6" data-cols="4">かんたん</button>
    <button id="lv8" data-pairs="8" data-cols="4">ふつう</button>
  </div>
  <div class="stats">
    <span>めくった回数 <b id="moves">0</b></span>
    <span>そろった <b id="pairs">0</b> / <span id="total">0</span></span>
    <span>じかん <b id="time">0:00</b></span>
  </div>
  <div class="table">
    <div class="grid" id="grid"></div>
    <div class="yay" id="yay"><div class="bubble" id="yaytext" aria-live="polite"></div><img id="yayimg" alt=""></div>
    <div class="win" id="win" hidden>
      <img id="winimg" alt="よろこぶあじゅ">
      <p class="big">ぜんぶそろったよ！</p>
      <p id="winmsg"></p>
      <button class="again" id="again">もういちど</button>
    </div>
  </div>
  <footer>桜 歩美のあじゅゲームセンター</footer>
</div>

const grid = document.getElementById("grid");
const $ = id => document.getElementById(id);
let first=null, second=null, lock=false, moves=0, got=0, total=0, start=0, timer=null, level=$("lv6");

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function tick(){$("time").textContent=fmt(Math.floor((Date.now()-start)/1000))}

const CHEERS=["やったね！","そろった！","いいね！","さすが！"];
let yayT=null;
function cheer(){const y=$("yay");$("yaytext").textContent=got===1?"やったね！":CHEERS[Math.floor(Math.random()*CHEERS.length)];
  y.classList.remove("show");void y.offsetWidth;y.classList.add("show");clearTimeout(yayT);yayT=setTimeout(()=>y.classList.remove("show"),1400)}
function newGame(btn){
  level=btn;
  document.querySelectorAll(".levels button").forEach(b=>b.setAttribute("aria-pressed",b===btn));
  total=+btn.dataset.pairs; grid.style.setProperty("--cols",btn.dataset.cols);
  const picks=shuffle(FACES.slice()).slice(0,total);
  const deck=shuffle(picks.flatMap(f=>[f,f]));
  grid.innerHTML="";
  deck.forEach(([id,name])=>{
    const b=document.createElement("button");
    b.className="card"; b.dataset.id=id; b.setAttribute("aria-label","うらむきのカード");
    b.innerHTML='<div class="inner"><div class="side back"><span>あ</span></div><div class="side front"><img alt=""></div></div>';
    b.querySelector("img").src=IMG[id]; b.querySelector("img").alt=name; b.dataset.name=name;
    b.addEventListener("click",()=>flip(b));
    grid.appendChild(b);
  });
  first=second=null; lock=false; moves=0; got=0;
  $("moves").textContent=0; $("pairs").textContent=0; $("total").textContent=total;
  clearInterval(timer); timer=null; $("time").textContent="0:00"; $("win").hidden=true;
}

function flip(c){
  if(lock||c===first||c.classList.contains("done"))return;
  if(!timer){start=Date.now();timer=setInterval(tick,500)}
  c.classList.add("open"); c.setAttribute("aria-label",c.dataset.name);
  if(!first){first=c;return}
  second=c; moves++; $("moves").textContent=moves;
  if(first.dataset.id===second.dataset.id){
    first.classList.add("done"); second.classList.add("done");
    first=second=null; got++; $("pairs").textContent=got;
    if(got<total)cheer();
    if(got===total){clearInterval(timer);timer=null;tick();
      setTimeout(()=>{$("winmsg").textContent=moves+"回めくって、"+$("time").textContent+"でクリア";$("win").hidden=false;$("again").focus()},700)}
  }else{
    lock=true;
    setTimeout(()=>{[first,second].forEach(x=>{x.classList.remove("open");x.setAttribute("aria-label","うらむきのカード")});first=second=null;lock=false},900);
  }
}
document.querySelectorAll(".levels button").forEach(b=>b.addEventListener("click",()=>newGame(b)));
